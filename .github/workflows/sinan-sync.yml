name: sinan-sync
on:
  schedule:
    - cron: "0 7 6 * *"   # dia 6 de cada mês, 07:00 UTC (checa se anos abertos mudaram; SINAN é anual)
  workflow_dispatch:
    inputs:
      inspecao:
        description: "Modo inspeção (1 = só listar FTP, colunas e codificações, sem publicar)"
        required: false
        default: "0"
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pandas pyreaddbc dbfread
      - run: python scripts/agrega_sinan.py
        env:
          INSPECAO: ${{ github.event.inputs.inspecao || '0' }}
      - run: |
          git config user.name "sinan-sync-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/
          git commit -m "SINAN: atualização" || echo "sem novidades"
          git push
